name: security-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JS sözdizimi
        run: node --check js/site.js && node --check js/content.js

      - name: CSP her sayfada var mı
        run: |
          fail=0
          for f in index.html menu.html about.html contact.html gizlilik.html; do
            grep -q 'Content-Security-Policy' "$f" || { echo "CSP eksik: $f"; fail=1; }
          done
          exit $fail

      - name: Dinamik kod / XSS desenleri
        run: |
          fail=0
          if grep -nE "eval\(|new Function|document\.write|setTimeout\(\"|setInterval\(\"" js/site.js js/content.js; then
            echo "Dinamik kod kullanımı bulundu"; fail=1
          fi
          if grep -nE 'target="_blank"' *.html | grep -v 'noopener'; then
            echo "rel=noopener eksik"; fail=1
          fi
          if grep -nE 'href="http://' *.html js/*.js; then
            echo "http (HTTPS olmayan) link bulundu"; fail=1
          fi
          exit $fail

      - name: Gizli değer / yerel yol ifşası
        run: |
          fail=0
          if grep -rniE "api[_-]?key|secret|passwd|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|Bearer [A-Za-z0-9]{10,}|xox[baprs]-" \
              --exclude-dir=.github --exclude-dir=.git --exclude-dir=node_modules \
              --include="*.js" --include="*.html" --include="*.json" --include="*.toml" .; then
            echo "Şüpheli gizli değer bulundu"; fail=1
          fi
          if grep -rn "C:\\\\Users" --exclude-dir=.git --exclude-dir=node_modules \
              --include="*.json" --include="*.md" --include="*.ps1" .; then
            echo "Yerel Windows yolu ifşası bulundu"; fail=1
          fi
          exit $fail

      - name: XSS / kaçış testleri
        run: node tests/security-tests.js
