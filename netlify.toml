# Netlify'ye deploy edeceksen güvenlik başlıkları buradan gelir.
# GitHub Pages özel header kabul etmez; orada CSP meta etiketiyle verilir (index.html vb.).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https:; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31556952; includeSubDomains"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
