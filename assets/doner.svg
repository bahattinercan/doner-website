<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Odun ateşinde dönen döner">
  <defs>
    <linearGradient id="meat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b255"/>
      <stop offset="0.55" stop-color="#c78429"/>
      <stop offset="1" stop-color="#8f4f2a"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a83a2c"/>
      <stop offset="1" stop-color="#e9b255"/>
