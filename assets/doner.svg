  </defs>

  <!-- ateş -->
  <g fill="url(#fire)" opacity=".85">
    <path d="M110 292c14-26 34-30 46-18 12 12 30 8 40-14 10 22 26 26 34 14c8 26-14 44-60 44s-70-16-60-44z"/>
