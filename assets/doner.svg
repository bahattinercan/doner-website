  <!-- lavaş -->
  <ellipse cx="160" cy="272" rx="96" ry="22" fill="#f6f0e4" opacity=".9"/>
  <ellipse cx="160" cy="268" rx="80" ry="14" fill="#fffaf3" opacity=".8"/>
