<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460" role="img" aria-label="Odun ateşinde dönen tandır döner illüstrasyonu">
  <defs>
    <linearGradient id="meat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c470"/>
      <stop offset="0.45" stop-color="#c78429"/>
      <stop offset="1" stop-color="#7c4222"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a83a2c"/>
      <stop offset="1" stop-color="#e9b255"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#e9b255" stop-opacity=".35"/>
      <stop offset="1" stop-color="#e9b255" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- arka plan + ocak ışığı -->
  <rect width="320" height="460" fill="#1b1611"/>
  <rect width="320" height="460" fill="url(#glow)"/>

  <!-- ateş -->
  <g fill="url(#fire)" opacity=".85">
    <path d="M96 400c16-30 38-34 52-20 14 14 34 9 46-16 12 26 30 30 40 16 10 30-16 50-70 50s-82-18-70-50z"/>
  </g>
  <g fill="#e9b255" opacity=".5">
    <path d="M126 392c9-18 22-20 29-11 7 9 18 7 25-9 7 16 18 18 23 9 5 19-12 30-48 30s-50-12-34-30z"/>
  </g>

  <!-- közler -->
  <g fill="#e9b255" opacity=".7">
    <circle cx="112" cy="352" r="3"/>
    <circle cx="206" cy="344" r="2.5"/>
    <circle cx="150" cy="336" r="2"/>
    <circle cx="232" cy="366" r="2.5"/>
  </g>

  <!-- şiş -->
  <rect x="156" y="24" width="8" height="330" rx="4" fill="#2c241c"/>
  <rect x="150" y="18" width="20" height="10" rx="5" fill="#2c241c"/>

  <!-- döner gövdesi -->
  <path d="M160 44 L244 262 Q244 320 160 320 Q76 320 76 262 Z" fill="url(#meat)"/>

  <!-- katman çizgileri -->
  <g stroke="#14110d" stroke-width="2" opacity=".32" fill="none" stroke-linecap="round">
    <path d="M104 140c26 8 40 22 48 38"/>
    <path d="M126 104c26 8 42 24 52 42"/>
    <path d="M88 200c30 8 46 18 56 32"/>
    <path d="M196 112c16 14 26 30 28 46"/>
    <path d="M112 240c30 6 44 14 54 24"/>
  </g>

  <!-- kıvrılan parça -->
  <path d="M244 250c20 12 28 30 22 46c-7 16-26 20-38 11" fill="none" stroke="#c78429" stroke-width="6" stroke-linecap="round"/>

  <!-- lavaş -->
  <ellipse cx="160" cy="352" rx="104" ry="24" fill="#f6f0e4" opacity=".92"/>
  <ellipse cx="160" cy="346" rx="86" ry="15" fill="#fffaf3" opacity=".8"/>
</svg>
