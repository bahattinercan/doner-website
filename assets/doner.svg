    <path d="M112 120c22 6 34 18 40 32"/>
    <path d="M132 92c22 6 36 20 44 36"/>
    <path d="M96 168c26 6 40 16 48 28"/>
    <path d="M188 100c14 12 22 26 24 40"/>
