<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tandır Döner logosu">
  <defs>
    <linearGradient id="tandir-et" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d79a"/>
      <stop offset=".55" stop-color="#e9b255"/>
      <stop offset="1" stop-color="#b9762a"/>
